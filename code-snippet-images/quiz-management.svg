<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#090b14"/></linearGradient><linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="652" rx="24" fill="#0b1020" stroke="#29334d" stroke-width="2"/>
  <circle cx="76" cy="76" r="8" fill="#fb7185"/><circle cx="104" cy="76" r="8" fill="#fbbf24"/><circle cx="132" cy="76" r="8" fill="#34d399"/>
  <text x="170" y="84" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">backend/routes/quiz.routes.js</text>
  <text x="72" y="150" fill="url(#accent)" font-family="Arial,sans-serif" font-size="38" font-weight="700">02  Quiz Management</text>
  <text x="72" y="204" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">Validate quiz input, then save it to MongoDB.</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="82" y="282" fill="#64748b">1</text><text x="130" y="282" fill="#c4b5fd">router</text><text x="198" y="282" fill="#e2e8f0">.post(</text><text x="260" y="282" fill="#86efac">'/'</text><text x="300" y="282" fill="#e2e8f0">, async (req, res, next) =&gt; {</text>
    <text x="82" y="326" fill="#64748b">2</text><text x="178" y="326" fill="#c4b5fd">try</text><text x="222" y="326" fill="#e2e8f0"> {</text><text x="260" y="326" fill="#c4b5fd">const</text><text x="326" y="326" fill="#e2e8f0"> { title, questions } = req.body;</text>
    <text x="82" y="370" fill="#64748b">3</text><text x="178" y="370" fill="#c4b5fd">if</text><text x="210" y="370" fill="#e2e8f0"> (!title || !Array.isArray(questions) || questions.length === 0) {</text>
    <text x="82" y="414" fill="#64748b">4</text><text x="226" y="414" fill="#c4b5fd">return</text><text x="294" y="414" fill="#e2e8f0"> res.status(400).json({ error: </text><text x="664" y="414" fill="#86efac">'title and questions required'</text><text x="990" y="414" fill="#e2e8f0"> });</text>
    <text x="82" y="458" fill="#64748b">5</text><text x="178" y="458" fill="#e2e8f0">}</text>
    <text x="82" y="502" fill="#64748b">6</text><text x="178" y="502" fill="#c4b5fd">const</text><text x="244" y="502" fill="#e2e8f0"> quiz = </text><text x="326" y="502" fill="#c4b5fd">await</text><text x="382" y="502" fill="#e2e8f0"> </text><text x="394" y="502" fill="#f9a8d4">new Quiz</text><text x="492" y="502" fill="#e2e8f0">(req.body).save();</text>
    <text x="82" y="546" fill="#64748b">7</text><text x="178" y="546" fill="#e2e8f0">res.status(201).json(quiz);</text>
    <text x="82" y="590" fill="#64748b">8</text><text x="178" y="590" fill="#c4b5fd">catch</text><text x="244" y="590" fill="#e2e8f0"> (err) { next(err); }</text>
  </g>
  <text x="72" y="644" fill="#64748b" font-family="Arial,sans-serif" font-size="18">AdaptiveIQ  •  CODE SNIPPET</text>
</svg>
