<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#090b14"/></linearGradient><linearGradient id="accent"><stop stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="652" rx="24" fill="#0b1020" stroke="#29334d" stroke-width="2"/>
  <circle cx="76" cy="76" r="8" fill="#fb7185"/><circle cx="104" cy="76" r="8" fill="#fbbf24"/><circle cx="132" cy="76" r="8" fill="#34d399"/>
  <text x="170" y="84" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">src/pages/AnalyticsPage.tsx</text>
  <text x="72" y="150" fill="url(#accent)" font-family="Arial,sans-serif" font-size="38" font-weight="700">06  Performance Analytics</text>
  <text x="72" y="204" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">Calculate accuracy for each quiz question.</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="82" y="282" fill="#64748b">1</text><text x="130" y="282" fill="#c4b5fd">const</text><text x="196" y="282" fill="#e2e8f0"> accuracyData = questions.slice(0, 6).map((question, index) =&gt; {</text>
    <text x="82" y="326" fill="#64748b">2</text><text x="178" y="326" fill="#c4b5fd">const</text><text x="244" y="326" fill="#e2e8f0"> questionAttempts = attempts.filter(</text>
    <text x="82" y="370" fill="#64748b">3</text><text x="226" y="370" fill="#e2e8f0">(answer) =&gt; answer.questionIndex === index</text>
    <text x="82" y="414" fill="#64748b">4</text><text x="178" y="414" fill="#e2e8f0">);</text>
    <text x="82" y="458" fill="#64748b">5</text><text x="178" y="458" fill="#c4b5fd">const</text><text x="244" y="458" fill="#e2e8f0"> correct = questionAttempts.filter(</text>
    <text x="82" y="502" fill="#64748b">6</text><text x="226" y="502" fill="#e2e8f0">(answer) =&gt; answer.isCorrect</text>
    <text x="82" y="546" fill="#64748b">7</text><text x="178" y="546" fill="#e2e8f0">).length;</text>
    <text x="82" y="590" fill="#64748b">8</text><text x="178" y="590" fill="#e2e8f0">return { name: </text><text x="346" y="590" fill="#86efac">`Q${index + 1}`</text><text x="500" y="590" fill="#e2e8f0">, accuracy: Math.round(correct / questionAttempts.length * 100) };</text>
  </g>
  <text x="72" y="644" fill="#64748b" font-family="Arial,sans-serif" font-size="18">AdaptiveIQ  •  CODE SNIPPET</text>
</svg>
